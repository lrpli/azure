{include file="../app/view/admin/header.html" title="编辑公告" /}

<div class="max-w-2xl">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
      <input id="title" type="text" value="{$ann.title}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">内容</label>
      <textarea id="content" rows="10" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{$ann.content}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">显示状态</label>
      <select id="status" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="1" {if $ann.status=='1'}selected{/if}>显示</option>
        <option value="0" {if $ann.status=='0'}selected{/if}>隐藏</option>
      </select>
    </div>
    <button id="update-btn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">保存修改</button>
  </div>
</div>

<script>
$('#update-btn').on('click', function(){
  azConfirm('确认更新此公告？','更新确认').then(function(){
    $.ajax({method:'PUT',url:'/admin/ann/{$ann.id}',
      data:{title:$('#title').val(),content:$('#content').val(),status:$('#status').val()},
      dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href='/admin/ann';},1200);}
    });
  }).catch(function(){});
});
</script>

{include file="../app/view/admin/footer.html" /}
