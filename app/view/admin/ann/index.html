{include file="../app/view/admin/header.html" title="公告列表" /}

<div class="mb-4">
  <a href="/admin/ann/create" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    添加公告
  </a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">#</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">标题</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">状态</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600 whitespace-nowrap">创建时间</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">操作</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        {volist id="ann" name="anns"}
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="px-4 py-3 text-gray-500">{$ann.id}</td>
          <td class="px-4 py-3 font-medium text-gray-900">{$ann.title}</td>
          <td class="px-4 py-3">
            {if $ann.status == 0}
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">隐藏</span>
            {else /}
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">显示</span>
            {/if}
          </td>
          <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">{:date('Y-m-d H:i', $ann.created_at)}</td>
          <td class="px-4 py-3">
            <div class="flex gap-1">
              <a href="/admin/ann/{$ann.id}/edit" class="px-2 py-1 text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg">编辑</a>
              <button onclick="removeAnn({$ann.id})" class="px-2 py-1 text-xs bg-red-50 hover:bg-red-100 text-red-700 rounded-lg">删除</button>
            </div>
          </td>
        </tr>
        {/volist}
      </tbody>
    </table>
  </div>
</div>

<script>
function removeAnn(id) {
  azDanger('确认删除此公告？删除后不可恢复。','删除确认','删除','取消').then(function(){
    $.ajax({method:'DELETE',url:'/admin/ann/'+id,dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.reload();},1000);}
    });
  }).catch(function(){});
}
</script>

{include file="../app/view/admin/footer.html" /}
