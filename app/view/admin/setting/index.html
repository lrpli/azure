{include file="../app/view/admin/header.html" title="基础设置" /}

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-5xl">
  <!-- Email notify -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">通知开关</h3>
    <div class="space-y-3">
      <div>
        <label class="block text-xs text-gray-500 mb-1">邮件</label>
        <select id="email_notify" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
      </div>
    </div>
    <button id="save_switch" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">保存</button>
  </div>

  <!-- Register -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">注册开关</h3>
    <div class="space-y-3">
      <div>
        <label class="block text-xs text-gray-500 mb-1">开放注册</label>
        <select id="allow_public_reg" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">注册邮箱验证码</label>
        <select id="reg_email_veriy" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
      </div>
    </div>
    <button id="save_register" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">保存</button>
  </div>

  <!-- Captcha -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">验证码</h3>
    <div class="space-y-3">
      <div>
        <label class="block text-xs text-gray-500 mb-1">提供者</label>
        <select id="captcha_provider" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="think-captcha">think-captcha</option>
          <option value="hcaptcha">hcaptcha</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">注册</label>
        <select id="registration_verification_code" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">登录</label>
        <select id="login_verification_code" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
      </div>
    </div>
    <button id="save_verification_code" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">保存</button>
  </div>

  <!-- hCaptcha -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">hCaptcha</h3>
    <div class="space-y-3">
      <div>
        <label class="block text-xs text-gray-500 mb-1">sitekey</label>
        <textarea id="hcaptcha_site_key" rows="2" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">{$verify.hcaptcha_site_key}</textarea>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">secret</label>
        <textarea id="hcaptcha_secret" rows="2" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">{$verify.hcaptcha_secret}</textarea>
      </div>
    </div>
    <button id="save_hcaptcha" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">保存</button>
  </div>

  <!-- Test email -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">邮件推送测试</h3>
    <div>
      <label class="block text-xs text-gray-500 mb-1">测试收件人</label>
      <input id="email_recipient" type="text" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <button id="test_email" class="mt-4 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors">发送测试邮件</button>
  </div>
</div>

<script>
$('#email_notify').val('{$switch.email_notify}');
$('#allow_public_reg').val('{$register.allow_public_reg}');
$('#reg_email_veriy').val('{$register.reg_email_veriy}');
$('#captcha_provider').val('{$verify.captcha_provider}');
$('#login_verification_code').val('{$verify.login_verification_code}');
$('#registration_verification_code').val('{$verify.registration_verification_code}');

function saveAndReload(data, redirectUrl) {
  azConfirm('确认提交这些设置？','修改确认').then(function(){
    $.ajax({method:'PUT',url:'/admin/setting',data:data,dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href=redirectUrl;},1200);}
    });
  }).catch(function(){});
}

$('#save_switch').on('click',function(){
  saveAndReload({class:'notify',email_notify:$('#email_notify').val()},'/admin/setting');
});
$('#save_register').on('click',function(){
  saveAndReload({class:'register',allow_public_reg:$('#allow_public_reg').val(),reg_email_veriy:$('#reg_email_veriy').val()},'/admin/setting');
});
$('#save_verification_code').on('click',function(){
  saveAndReload({class:'verify',captcha_provider:$('#captcha_provider').val(),login_verification_code:$('#login_verification_code').val(),registration_verification_code:$('#registration_verification_code').val()},'/admin/setting');
});
$('#save_hcaptcha').on('click',function(){
  saveAndReload({class:'hcaptcha',hcaptcha_site_key:$('#hcaptcha_site_key').val(),hcaptcha_secret:$('#hcaptcha_secret').val()},'/admin/setting');
});
$('#test_email').on('click',function(){
  $.ajax({method:'POST',url:'/admin/setting/email/test',data:{recipient:$('#email_recipient').val()},dataType:'json',
    success:function(d){toast(d.content,d.status=='1'?'success':'error');}
  });
});
</script>

{include file="../app/view/admin/footer.html" /}
