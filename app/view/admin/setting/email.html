{include file="../app/view/admin/header.html" title="邮件设置" /}

<div class="max-w-lg">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">发信主机</label>
      <input id="smtp_host" type="text" value="{$smtp.smtp_host ?? ''}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">发信账户</label>
      <input id="smtp_username" type="text" value="{$smtp.smtp_username ?? ''}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">发信账户密码</label>
      <input id="smtp_password" type="text" value="{$smtp.smtp_password ?? ''}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">发信端口</label>
      <input id="smtp_port" type="number" value="{$smtp.smtp_port ?? ''}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">发件人昵称</label>
      <input id="smtp_name" type="text" value="{$smtp.smtp_name ?? ''}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">发件人地址</label>
      <input id="smtp_sender" type="text" value="{$smtp.smtp_sender ?? ''}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <button id="modify-btn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">保存设置</button>
  </div>
</div>

<script>
$('#modify-btn').on('click', function(){
  azConfirm('确认提交这些邮件设置？','修改确认').then(function(){
    $.ajax({method:'PUT',url:'/admin/setting/email',
      data:{smtp_host:$('#smtp_host').val(),smtp_username:$('#smtp_username').val(),smtp_password:$('#smtp_password').val(),smtp_port:$('#smtp_port').val(),smtp_name:$('#smtp_name').val(),smtp_sender:$('#smtp_sender').val()},
      dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href='/admin/setting/email';},1200);}
    });
  }).catch(function(){});
});
</script>

{include file="../app/view/admin/footer.html" /}
