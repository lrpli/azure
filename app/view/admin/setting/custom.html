{include file="../app/view/admin/header.html" title="网站设置" /}

<div class="max-w-2xl">
  <p class="text-sm text-gray-500 mb-4">底部文字支持 HTML 语法</p>
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">底部文字</label>
      <textarea id="custom_text" rows="3" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{$custom.custom_text}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">自定义 JavaScript 代码</label>
      <textarea id="custom_script" rows="10" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">{$custom.custom_script}</textarea>
    </div>
    <button id="modify-btn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">保存设置</button>
  </div>
</div>

<script>
$('#modify-btn').on('click', function(){
  azConfirm('确认应用这些网站设置？','修改确认').then(function(){
    $.ajax({method:'PUT',url:'/admin/setting/custom',
      data:{custom_text:$('#custom_text').val(),custom_script:$('#custom_script').val()},
      dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href='/admin/setting/custom';},1200);}
    });
  }).catch(function(){});
});
</script>
