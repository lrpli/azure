{include file="../app/view/admin/header.html" title="添加用户" /}

<div class="max-w-lg">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">登录邮箱</label>
      <input id="user_email" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">登录密码 <span class="text-gray-400 font-normal">（留空则随机生成）</span></label>
      <input id="user_passwd" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">用户备注</label>
      <input id="user_remark" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">身份</label>
      <select id="is_admin" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="0">注册用户</option>
        <option value="1">管理员</option>
      </select>
    </div>
    <p class="text-xs text-gray-400">若开启了邮件推送，面板地址和密码将发送到登录邮箱</p>
    <button id="create-btn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">添加用户</button>
  </div>
</div>

<script>
$('#create-btn').on('click', function(){
  azConfirm('确认添加此新用户？','添加确认').then(function(){
    $.ajax({method:'POST',url:'/admin/user',
      data:{email:$('#user_email').val(),passwd:$('#user_passwd').val(),remark:$('#user_remark').val(),admin:$('#is_admin').val()},
      dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href='/admin/user';},1200);}
    });
  }).catch(function(){});
});
</script>

{include file="../app/view/admin/footer.html" /}
