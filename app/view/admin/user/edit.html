{include file="../app/view/admin/header.html" title="编辑用户" /}

<div class="max-w-lg">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <div class="grid grid-cols-2 gap-3 text-xs">
      <div class="bg-gray-50 rounded-lg p-3"><p class="text-gray-500 mb-1">用户编号</p><p class="font-mono">{$user.id}</p></div>
      <div class="bg-gray-50 rounded-lg p-3"><p class="text-gray-500 mb-1">注册时间</p><p>{:date('Y-m-d H:i', $user.created_at)}</p></div>
      <div class="bg-gray-50 rounded-lg p-3"><p class="text-gray-500 mb-1">通知邮箱</p><p class="break-all">{$user.notify_email ?? '未设置'}</p></div>
      <div class="bg-gray-50 rounded-lg p-3"><p class="text-gray-500 mb-1">Telegram</p><p>{$user.notify_tg ?? '未设置'}</p></div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">登录邮箱</label>
      <input id="user_email" type="text" value="{$user.email}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">新密码 <span class="text-gray-400 font-normal">（留空则不修改）</span></label>
      <input id="user_passwd" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">用户备注</label>
      <input id="user_remark" type="text" value="{$user.remark ?? ''}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">身份</label>
        <select id="is_admin" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="0">注册用户</option>
          <option value="1" {if $user.is_admin=='1'}selected{/if}>管理员</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
        <select id="status" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="0">停用</option>
          <option value="1" {if $user.status=='1'}selected{/if}>启用</option>
        </select>
      </div>
    </div>
    <button id="update-btn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">保存修改</button>
  </div>
</div>

<script>
$('#update-btn').on('click', function(){
  azConfirm('确认修改此用户资料？','修改确认').then(function(){
    $.ajax({method:'PUT',url:'/admin/user/{$user.id}',
      data:{remark:$('#user_remark').val(),email:$('#user_email').val(),passwd:$('#user_passwd').val(),admin:$('#is_admin').val(),status:$('#status').val()},
      dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href='/admin/user';},1200);}
    });
  }).catch(function(){});
});
</script>

{include file="../app/view/admin/footer.html" /}
