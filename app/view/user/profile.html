{include file="../app/view/user/header.html" title="账户资料" /}

<!-- Tabs -->
<div class="flex gap-1 mb-6 bg-gray-100 p-1 rounded-xl w-fit">
  <button class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium transition-all" data-tab="personalize">个人偏好</button>
  <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-all" data-tab="notify">推送接收</button>
  <button class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-all" data-tab="passwd">修改密码</button>
</div>

<!-- 个人偏好 -->
<div id="tab-personalize" class="tab-pane bg-white rounded-xl shadow-sm border border-gray-200 p-6">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">默认登录账户</label>
      <input id="vm_default_identity" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="{$personalise.vm_default_identity}"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">默认登录密码</label>
      <input id="vm_default_credentials" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="{$personalise.vm_default_credentials}"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">默认地区</label>
      <select id="vm_location" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        {volist name="locations" id="location"}
        <option value="{$key}">{$location}</option>
        {/volist}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">默认规格</label>
      <select id="vm_size" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        {volist name="sizes" id="size"}
        <option value="{$key}">{:str_replace('Standard_','',$key)} {$size.cpu}C_{$size.memory}G ({:round($size.cost,1)} USD/mo)</option>
        {/volist}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">默认存储</label>
      <select id="vm_disk_size" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        {foreach $disk_sizes as $disk_size}
        <option value="{$disk_size}">{$disk_size} GB</option>
        {/foreach}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">默认镜像</label>
      <select id="vm_image" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        {volist name="images" id="image"}
        <option value="{$key}">{$image.display}</option>
        {/volist}
      </select>
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-gray-700 mb-1">默认启动脚本</label>
      <textarea id="vm_default_script" rows="6" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">{$personalise.vm_default_script ?? ''}</textarea>
      <p class="text-xs text-gray-400 mt-1">脚本以普通用户身份运行，需要 root 权限的命令请加 <code>sudo</code></p>
    </div>
  </div>
  <button id="update_personalise" class="mt-4 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">保存偏好</button>
</div>

<!-- 推送接收 -->
<div id="tab-notify" class="tab-pane hidden bg-white rounded-xl shadow-sm border border-gray-200 p-6">
  <div class="max-w-md">
    <label class="block text-sm font-medium text-gray-700 mb-1">接收邮箱</label>
    <input id="user_email" type="email" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="{$profile.notify_email ?? ''}"/>
    <button id="update_notify" class="mt-4 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">保存</button>
  </div>
</div>

<!-- 修改密码 -->
<div id="tab-passwd" class="tab-pane hidden bg-white rounded-xl shadow-sm border border-gray-200 p-6">
  <div class="max-w-md space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">当前密码</label>
      <input id="now_passwd" type="password" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
      <input id="new_passwd" type="password" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
      <input id="again_passwd" type="password" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <button id="update_passwd" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl transition-colors">修改密码</button>
  </div>
</div>

<script>
/* Tabs */
$('.tab-btn').on('click',function(){
  $('.tab-btn').removeClass('active bg-white shadow-sm text-gray-900').addClass('text-gray-500');
  $(this).addClass('active bg-white shadow-sm text-gray-900').removeClass('text-gray-500');
  $('.tab-pane').addClass('hidden');
  $('#tab-'+$(this).data('tab')).removeClass('hidden');
});
$('.tab-btn.active').addClass('bg-white shadow-sm text-gray-900');
$('.tab-btn:not(.active)').addClass('text-gray-500');

/* Set defaults */
$('#vm_size').val('{$personalise.vm_size}');
$('#vm_image').val('{$personalise.vm_image}');
$('#vm_location').val('{$personalise.vm_location}');
$('#vm_disk_size').val('{$personalise.vm_disk_size}');

$('#update_notify').on('click',function(){
  azConfirm('确认修改推送邮箱？','修改推送').then(function(){
    $.ajax({method:'PUT',url:'/user/profile/notify',data:{user_email:$('#user_email').val()},dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.reload();},1200);}});
  }).catch(function(){});
});

$('#update_passwd').on('click',function(){
  azConfirm('确认修改登录密码？','修改密码').then(function(){
    $.ajax({method:'PUT',url:'/user/profile/passwd',data:{now_passwd:$('#now_passwd').val(),new_passwd:$('#new_passwd').val(),again_passwd:$('#again_passwd').val()},dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');}});
  }).catch(function(){});
});

$('#update_personalise').on('click',function(){
  $.ajax({method:'PUT',url:'/user/profile/personalise',data:{
    vm_size:$('#vm_size').val(),vm_image:$('#vm_image').val(),vm_location:$('#vm_location').val(),
    vm_disk_size:$('#vm_disk_size').val(),vm_default_script:$('#vm_default_script').val(),
    vm_default_identity:$('#vm_default_identity').val(),vm_default_credentials:$('#vm_default_credentials').val()
  },dataType:'json',success:function(d){toast(d.content,d.status=='1'?'success':'error');}});
});
</script>

{include file="../app/view/user/footer.html" /}
