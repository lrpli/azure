{include file="../app/view/user/header.html" title="编辑账户" /}

<div class="max-w-2xl">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">登录邮箱</label>
        <textarea id="az_email" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{$account.az_email}</textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">登录密码 <span class="text-gray-400 font-normal">（选填）</span></label>
        <textarea id="az_passwd" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{$account.az_passwd}</textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
        <textarea id="user_mark" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{$account.user_mark}</textarea>
      </div>
    </div>

    <div class="mt-4 pt-4 border-t border-gray-100">
      <p class="text-sm font-medium text-gray-700 mb-3">只读信息</p>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
        <div class="bg-gray-50 rounded-lg p-3">
          <p class="text-gray-500 mb-1">App ID</p>
          <p class="font-mono text-gray-700 break-all">{$az_api.appId}</p>
        </div>
        <div class="bg-gray-50 rounded-lg p-3">
          <p class="text-gray-500 mb-1">Tenant ID</p>
          <p class="font-mono text-gray-700 break-all">{$az_api.tenant}</p>
        </div>
        <div class="bg-gray-50 rounded-lg p-3 md:col-span-2">
          <p class="text-gray-500 mb-1">Subscription ID</p>
          <p class="font-mono text-gray-700 break-all">{$account.az_sub_id}</p>
        </div>
      </div>
      <button id="copy-api" data-text="{$share}" class="mt-3 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors">
        复制 API 参数
      </button>
    </div>

    <button id="update-btn" class="mt-6 w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">保存修改</button>
  </div>
</div>

<script>
$('#copy-api').on('click',function(){
  navigator.clipboard.writeText($(this).data('text')).then(function(){ toast('复制成功','success'); });
});
$('#update-btn').on('click',function(){
  azConfirm('确认更新此账户资料？','更新确认').then(function(){
    $.ajax({method:'PUT',url:'/user/azure/{$account.id}',
      data:{user_mark:$('#user_mark').val(),az_email:$('#az_email').val(),az_passwd:$('#az_passwd').val()},
      dataType:'json',
      success:function(d){toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href='/user/azure';},1200);}
    });
  }).catch(function(){});
});
</script>

{include file="../app/view/user/footer.html" /}
