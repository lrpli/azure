{include file="../app/view/user/header.html" title="添加 Azure 账户" /}

<div class="max-w-3xl">
  <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6 text-sm text-blue-700">
    填写 API 凭证后点击添加，面板将自动获取订阅信息。若有 JSON 配置块可直接粘贴到"自动识别"区域。
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">登录邮箱</label>
        <textarea id="az_email" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">登录密码 <span class="text-gray-400 font-normal">（选填）</span></label>
        <textarea id="az_passwd" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">App ID <span class="text-gray-400 font-normal">（自动识别可不填）</span></label>
        <textarea id="az_app_id" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-gray-400 font-normal">（自动识别可不填）</span></label>
        <textarea id="az_secret" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tenant ID <span class="text-gray-400 font-normal">（自动识别可不填）</span></label>
        <textarea id="az_tenant_id" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
        <textarea id="user_mark" rows="2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">自动识别区块 <span class="text-gray-400 font-normal">（完整 JSON，填写后上方字段可留空）</span></label>
        <textarea id="az_configs" rows="5" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
    </div>
    <div class="mt-4 flex items-center gap-4">
      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        <input id="ignore_status" type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"/>
        忽略订阅状态
      </label>
      <div class="flex items-center gap-2 text-sm text-gray-700">
        <span>备注填充:</span>
        <select id="remark_filling" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="input">使用输入框值</option>
          <option value="{:date('md')}">{:date('md')}</option>
          {volist name="notes" id="note"}
          <option value="{$note.user_mark}">{$note.user_mark}</option>
          {/volist}
        </select>
      </div>
    </div>
    <button id="add-btn" class="mt-6 w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors">添加账户</button>
  </div>
</div>

<script>
$('#add-btn').on('click',function(){
  azConfirm('面板将获取订阅详情和虚拟机列表，约需 3~5 秒，请勿重复点击。','添加确认','确定','取消').then(function(){
    var prog=azProgress('添加中');
    $.ajax({method:'POST',url:'/user/azure',
      data:{az_email:$('#az_email').val(),az_passwd:$('#az_passwd').val(),az_app_id:$('#az_app_id').val(),az_secret:$('#az_secret').val(),az_tenant_id:$('#az_tenant_id').val(),az_configs:$('#az_configs').val(),user_mark:$('#user_mark').val(),remark_filling:$('#remark_filling').val(),ignore_status:$('#ignore_status').is(':checked')},
      dataType:'json',
      success:function(d){prog.close();toast(d.content,d.status=='1'?'success':'error');if(d.status=='1')setTimeout(function(){location.href='/user/azure';},1200);}
    });
  }).catch(function(){});
});
</script>

{include file="../app/view/user/footer.html" /}
