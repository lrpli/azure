<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{$title|default='AzPanel'} — {:think\facade\Env::get('app.APP_NAME','AzPanel')}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<style>
[x-cloak]{display:none}
.sidebar-link { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; font-size:14px; color:#94a3b8; transition:all .15s; cursor:pointer; }
.sidebar-link:hover,.sidebar-link.active { background:#1e293b; color:#fff; }
.sidebar-link svg { flex-shrink:0; }
#sidebar { transition: transform .2s; }
@media(max-width:768px){ #sidebar{transform:translateX(-100%); position:fixed; z-index:40; } #sidebar.open{transform:translateX(0);} }
</style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

<!-- Toast container -->
<div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2" style="z-index:9999"></div>

<!-- Modal container -->
<div id="modal-container"></div>

<!-- Sidebar -->
<aside id="sidebar" class="w-60 bg-slate-900 flex flex-col h-full flex-shrink-0">
  <div class="px-5 py-5 border-b border-slate-700/50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
        </svg>
      </div>
      <span class="text-white font-semibold text-sm">{:think\facade\Env::get('app.APP_NAME','AzPanel')}</span>
    </div>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    <div class="mb-1">
      <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Azure</p>
      <a href="/user/azure" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        账户列表
      </a>
      <a href="/user/azure/create" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        添加账户
      </a>
    </div>
    <div class="mb-1">
      <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1 mt-3">虚拟机</p>
      <a href="/user/server/azure" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>
        虚拟机列表
      </a>
      <a href="/user/server/azure/create" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        创建虚拟机
      </a>
    </div>
    <div class="border-t border-slate-700/50 mt-3 pt-3">
      <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">我的账户</p>
      <a href="/user" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        用户中心
      </a>
      <a href="/user/profile" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        个人资料
      </a>
      <a href="/user/login" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        登录记录
      </a>
      {if session('is_admin') == 1}
      <a href="/admin" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        管理后台
      </a>
      {/if}
    </div>
  </nav>

  <div class="px-3 py-3 border-t border-slate-700/50">
    <button id="logout-btn" class="sidebar-link w-full text-left hover:text-red-400 hover:bg-red-900/20">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      退出登录
    </button>
  </div>
</aside>

<!-- Mobile overlay -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

<!-- Main content -->
<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
  <!-- Top bar (mobile) -->
  <div class="md:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3">
    <button id="sidebar-toggle" class="text-gray-600">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="font-semibold text-gray-800">{:think\facade\Env::get('app.APP_NAME','AzPanel')}</span>
  </div>

  <main class="flex-1 overflow-y-auto">
    <div class="p-6 lg:p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">{$title|default=''}</h1>
