  </div><!-- /card -->
</div><!-- /max-w-md -->

<script>
function toast(msg, type) {
  var colors = { success:'bg-green-500', error:'bg-red-500', info:'bg-blue-500', warning:'bg-yellow-500' };
  var cls = colors[type] || colors.info;
  var el = $('<div class="toast flex items-center gap-2 px-4 py-3 rounded-xl text-white text-sm shadow-lg ' + cls + '">' + msg + '</div>');
  $('#toast-container').append(el);
  setTimeout(function(){ el.fadeOut(300, function(){ el.remove(); }); }, 3500);
}
</script>
</body>
</html>
