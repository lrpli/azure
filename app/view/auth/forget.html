{include file="../app/view/auth/header.html" title="重置密码" /}

<div class="px-8 py-8">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">重置密码</h2>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">注册邮箱</label>
      <input id="email" type="email" placeholder="your@email.com"
        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
      <input id="passwd" type="password" placeholder="••••••••"
        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
      <input id="repeat_passwd" type="password" placeholder="••••••••"
        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
    </div>
    <div class="flex gap-2">
      <input id="verify_code" type="text" placeholder="邮箱验证码"
        class="flex-1 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      <button id="request_code" class="px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition whitespace-nowrap">获取验证码</button>
    </div>
    <button id="forget_password"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors">
      重置密码
    </button>
  </div>
  <div class="mt-5 text-center text-sm">
    <a href="/login" class="text-blue-600 hover:underline">返回登录</a>
  </div>
</div>

<script>
$('#forget_password').on('click', function() {
  $.ajax({
    method:'POST', url:'/forget',
    data:{ email:$('#email').val(), passwd:$('#passwd').val(), repeat_passwd:$('#repeat_passwd').val(), verify_code:$('#verify_code').val() },
    dataType:'json',
    success:function(d){ toast(d.content, d.status=='1'?'success':'error'); if(d.status=='1') setTimeout(function(){ location.href='/login'; },1200); }
  });
});
$('#request_code').on('click', function() {
  $.ajax({
    method:'POST', url:'/forget/code',
    data:{ email:$('#email').val() },
    dataType:'json',
    success:function(d){ toast(d.content, d.status=='1'?'success':'info'); }
  });
});
</script>

{include file="../app/view/auth/footer.html" /}
