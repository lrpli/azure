{include file="../app/view/auth/header.html" title="登录" /}

<div class="px-8 py-8">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">账号登录</h2>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
      <input id="email" type="email" placeholder="your@email.com"
        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
      <input id="password" type="password" placeholder="••••••••"
        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
    </div>
    {if $verify.login_verification_code == '1'}
    {if $verify.captcha_provider == 'think-captcha'}
    <div class="flex gap-3 items-center">
      <input id="code" type="text" placeholder="验证码"
        class="flex-1 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      <div>{:captcha_img()}</div>
    </div>
    {/if}
    {if $verify.captcha_provider == 'hcaptcha'}
    <div class="h-captcha" data-sitekey="{$verify.hcaptcha_site_key}"></div>
    {/if}
    {/if}
    <button id="login-btn"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors">
      登 录
    </button>
  </div>
  <div class="flex justify-between mt-5 text-sm">
    <a href="/forget" class="text-blue-600 hover:underline">忘记密码？</a>
    <a href="/register" class="text-blue-600 hover:underline">注册账号</a>
  </div>
</div>

<script>
$('#login-btn').on('click', function() {
  $.ajax({
    method:'POST', url:'/login',
    data:{ email:$('#email').val(), password:$('#password').val(), code:$('#code').val(), hcaptcha_result:$('[name=h-captcha-response]').val() },
    dataType:'json',
    success:function(d){ toast(d.content, d.status=='1'?'success':'error'); if(d.status=='1') setTimeout(function(){ location.href='/user'; },1200); }
  });
});
$('#password').on('keydown', function(e){ if(e.key==='Enter') $('#login-btn').click(); });
</script>

{include file="../app/view/auth/footer.html" /}
