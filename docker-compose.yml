services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_DEBUG=false
      - APP_NAME=AzPanel
      - DB_HOSTNAME=db
      - DB_DATABASE=azpanel
      - DB_USERNAME=azpanel
      - DB_PASSWORD=${DB_PASSWORD:-azpanel123}
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./runtime:/var/www/html/runtime
    networks:
      - azpanel

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: azpanel
      MYSQL_USER: azpanel
      MYSQL_PASSWORD: ${DB_PASSWORD:-azpanel123}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/azure.sql:/docker-entrypoint-initdb.d/01_azure.sql:ro
      - ./database/config.sql:/docker-entrypoint-initdb.d/02_config.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/03_seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "azpanel", "-p${DB_PASSWORD:-azpanel123}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - azpanel

volumes:
  db_data:

networks:
  azpanel:
    driver: bridge
